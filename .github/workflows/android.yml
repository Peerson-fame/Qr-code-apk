name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6 and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 qrcode Pillow

      - name: Download Android SDK/NDK for PySide6
        run: |
          git clone --depth 1 https://code.qt.io/pyside/pyside-setup
          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only --skip-update --auto-accept-license

      - name: Download Android PySide6 wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download PySide6 --android --arch aarch64

      - name: Locate wheels
        id: wheels
        shell: bash
        run: |
          PYSIDE=$(find "$GITHUB_WORKSPACE/android-wheels" -name 'PySide6-*-android_aarch64.whl' | head -n 1)
          SHIBOKEN=$(find "$GITHUB_WORKSPACE/android-wheels" -name 'shiboken6-*-android_aarch64.whl' | head -n 1)
          test -n "$PYSIDE"
          test -n "$SHIBOKEN"
          echo "pyside=$PYSIDE" >> "$GITHUB_OUTPUT"
          echo "shiboken=$SHIBOKEN" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          pyside6-android-deploy \
            --name "QR Master Grid" \
            --wheel-pyside="${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken="${{ steps.wheels.outputs.shiboken }}" \
            --ndk-path="$HOME/.pyside6-android-deploy/android-ndk" \
            --sdk-path="$HOME/.pyside6-android-deploy/android-sdk" \
            --force \
            --verbose

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Master-Grid-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
